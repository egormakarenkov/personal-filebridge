name: Windows tests and package

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install --upgrade pip build .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Fresh setup in disposable profile
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'allowed-root'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'filebridge-local'
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'filebridge-user'
          New-Item -ItemType Directory -Force -Path $root, $env:LOCALAPPDATA, $env:USERPROFILE | Out-Null
          .\setup.ps1 -AllowedRoots @($root) -SkipCodexRegistration
          $config = Get-Content -LiteralPath (Join-Path $env:LOCALAPPDATA 'PersonalFilebridge\config.json') -Raw | ConvertFrom-Json
          if ($config.allowed_roots.Count -ne 1 -or $config.allowed_roots[0] -ne $root) { throw 'Setup did not save the selected root.' }
          .\.venv\Scripts\python.exe -m filebridge.server --help
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        shell: pwsh
        run: |
          python -m pip install twine
          if ($LASTEXITCODE -ne 0) { throw 'Could not install twine.' }
          $packages = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object FullName)
          if ($packages.Count -eq 0) { throw 'No distributions were built.' }
          python -m twine check $packages
          if ($LASTEXITCODE -ne 0) { throw 'Distribution check failed.' }
